<!DOCTYPE html>
<html>
<head>
  <title>Cricket Score Tracker</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: black;
      color: white;
    }
    h1 {
      color: red;
      font-size: 40px;
    }
    .box {
      border: 2px solid white;
      padding: 20px;
      margin: 20px;
      font-size: 22px;
    }
    button {
      font-size: 20px;
      padding: 10px;
      margin: 5px;
    }
  </style>
</head>

<body>

<h1>🏏 Cricket Score Tracker</h1>

<div class="box">
  <p>Match: India vs Australia</p>
  <p id="score">Score: 0/0</p>
  <p id="overs">Overs: 0</p>
</div>

<h2>Update Score</h2>

<button onclick="addRun()">+1 Run</button>
<button onclick="addWicket()">Wicket</button>
<button onclick="addOver()">+1 Over</button>

<script>
let runs = 0;
let wickets = 0;
let overs = 0;

function addRun() {
  runs++;
  document.getElementById("score").innerText = "Score: " + runs + "/" + wickets;
}

function addWicket() {
  wickets++;
  document.getElementById("score").innerText = "Score: " + runs + "/" + wickets;
}

function addOver() {
  overs++;
  document.getElementById("overs").innerText = "Overs: " + overs;
}
</script>

</body>
</html>

</body>
</html>
