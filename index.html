<!DOCTYPE html>
<html>
<head>
  <title>Sports Tabs Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eaeded;
    }

    /* NAVBAR */
    .navbar {
      background: #131921;
      color: white;
      padding: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .logo {
      color: orange;
      font-weight: bold;
      font-size: 20px;
    }

    /* TABS */
    .tabs {
      display: flex;
      background: #232f3e;
    }

    .tab {
      padding: 12px;
      color: white;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .tab:hover {
      background: #37475a;
    }

    .active {
      background: orange;
      color: black;
    }

    /* CONTENT */
    .container {
      display: none;
      justify-content: center;
      margin-top: 30px;
    }

    .show {
      display: flex;
    }

    .card {
      background: white;
      padding: 20px;
      width: 350px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .score {
      font-size: 28px;
      margin: 10px;
      color: green;
    }

    input, button {
      padding: 8px;
      margin: 5px;
    }

    button {
      background: #ffd814;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="navbar">
  <div class="logo">SportsHub</div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="openTab('cricket')">🏏 Cricket</div>
  <div class="tab" onclick="openTab('football')">⚽ Football</div>
  <div class="tab" onclick="openTab('basketball')">🏀 Basketball</div>
</div>

<!-- CRICKET -->
<div id="cricket" class="container show">
  <div class="card">
    <h2>Cricket</h2>
    <div class="score" id="cScore">0 - 0</div>
    <button onclick="cA()">Team A +</button>
    <button onclick="cB()">Team B +</button>
    <button onclick="cReset()">Reset</button>
  </div>
</div>

<!-- FOOTBALL -->
<div id="football" class="container">
  <div class="card">
    <h2>Football</h2>
    <div class="score" id="fScore">0 - 0</div>
    <button onclick="fA()">Team A +</button>
    <button onclick="fB()">Team B +</button>
    <button onclick="fReset()">Reset</button>
  </div>
</div>

<!-- BASKETBALL -->
<div id="basketball" class="container">
  <div class="card">
    <h2>Basketball</h2>
    <div class="score" id="bScore">0 - 0</div>
    <button onclick="bA()">Team A +</button>
    <button onclick="bB()">Team B +</button>
    <button onclick="bReset()">Reset</button>
  </div>
</div>

<script>
// TAB SWITCH
function openTab(tabName) {
  let tabs = document.querySelectorAll(".container");
  let buttons = document.querySelectorAll(".tab");

  tabs.forEach(t => t.classList.remove("show"));
  buttons.forEach(b => b.classList.remove("active"));

  document.getElementById(tabName).classList.add("show");
  event.target.classList.add("active");
}

// CRICKET
let ca=0, cb=0;
function cUpdate(){ document.getElementById("cScore").innerText = ca+" - "+cb; }
function cA(){ ca++; cUpdate(); }
function cB(){ cb++; cUpdate(); }
function cReset(){ ca=0; cb=0; cUpdate(); }

// FOOTBALL
let fa=0, fb=0;
function fUpdate(){ document.getElementById("fScore").innerText = fa+" - "+fb; }
function fA(){ fa++; fUpdate(); }
function fB(){ fb++; fUpdate(); }
function fReset(){ fa=0; fb=0; fUpdate(); }

// BASKETBALL
let ba=0, bb=0;
function bUpdate(){ document.getElementById("bScore").innerText = ba+" - "+bb; }
function bA(){ ba++; bUpdate(); }
function bB(){ bb++; bUpdate(); }
function bReset(){ ba=0; bb=0; bUpdate(); }
</script>

</body>
</html>
