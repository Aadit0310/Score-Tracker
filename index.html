<!DOCTYPE html>
<html>
<head>
<title>IPL Pro Scorer</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI';
  background:#0b1d2a;
  color:white;
}

/* HEADER */
header{
  background:#111;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* MAIN */
.container{
  padding:15px;
}

/* SCOREBAR */
.scorebar{
  background:#1c2b3a;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.big{
  font-size:32px;
  font-weight:bold;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #333;
  text-align:center;
}

/* BUTTON GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#ff9800;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffb300;
}
</style>
</head>

<body>

<header>🏏 IPL LIVE SCORER</header>

<div class="container">

<div class="scorebar">
  <div class="big" id="score">0/0</div>
  <div id="overs">0.0 overs</div>
</div>

<!-- BATSMAN TABLE -->
<h3>Batting</h3>
<table>
<tr><th>Name</th><th>R</th><th>B</th><th>SR</th></tr>
<tr><td id="b1">Player 1</td><td id="r1">0</td><td id="b1b">0</td><td id="sr1">0</td></tr>
<tr><td id="b2">Player 2</td><td id="r2">0</td><td id="b2b">0</td><td id="sr2">0</td></tr>
</table>

<!-- BOWLER -->
<h3>Bowling</h3>
<table>
<tr><th>Name</th><th>O</th><th>R</th><th>W</th><th>ECO</th></tr>
<tr><td id="bowler">Bowler</td><td id="bo">0</td><td id="br">0</td><td id="bw">0</td><td id="eco">0</td></tr>
</table>

<!-- BUTTONS -->
<div class="grid">
<button onclick="scoreRun(0)">0</button>
<button onclick="scoreRun(1)">1</button>
<button onclick="scoreRun(2)">2</button>
<button onclick="scoreRun(3)">3</button>
<button onclick="scoreRun(4)">4</button>
<button onclick="scoreRun(6)">6</button>
<button onclick="wicket()">W</button>
<button onclick="wide()">WD</button>
</div>

</div>

<script>

let totalRuns=0, wickets=0, balls=0;

// batsmen
let striker={name:"Player 1",runs:0,balls:0};
let nonStriker={name:"Player 2",runs:0,balls:0};

// bowler
let bowler={name:"Bowler",runs:0,wickets:0,balls:0};

function update(){

document.getElementById("score").innerText = totalRuns+"/"+wickets;
document.getElementById("overs").innerText =
Math.floor(balls/6)+"."+(balls%6)+" overs";

// batsman
document.getElementById("b1").innerText=striker.name+"*";
document.getElementById("r1").innerText=striker.runs;
document.getElementById("b1b").innerText=striker.balls;
document.getElementById("sr1").innerText=calcSR(striker);

document.getElementById("b2").innerText=nonStriker.name;
document.getElementById("r2").innerText=nonStriker.runs;
document.getElementById("b2b").innerText=nonStriker.balls;
document.getElementById("sr2").innerText=calcSR(nonStriker);

// bowler
document.getElementById("bowler").innerText=bowler.name;
document.getElementById("bo").innerText =
Math.floor(bowler.balls/6)+"."+(bowler.balls%6);
document.getElementById("br").innerText=bowler.runs;
document.getElementById("bw").innerText=bowler.wickets;
document.getElementById("eco").innerText=calcEco();

}

function calcSR(p){
return p.balls ? ((p.runs/p.balls)*100).toFixed(1):0;
}

function calcEco(){
let overs=bowler.balls/6;
return overs? (bowler.runs/overs).toFixed(1):0;
}

function swap(){
let temp=striker;
striker=nonStriker;
nonStriker=temp;
}

function scoreRun(r){

totalRuns+=r;
balls++;
bowler.runs+=r;
bowler.balls++;

striker.runs+=r;
striker.balls++;

if(r%2===1) swap();
if(balls%6===0) swap();

update();
}

function wicket(){
wickets++;
balls++;
bowler.wickets++;
bowler.balls++;

striker={name:"New Player "+(wickets+2),runs:0,balls:0};

update();
}

function wide(){
totalRuns++;
bowler.runs++;
update();
}

update();

</script>

</body>
</html>
