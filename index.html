<!DOCTYPE html>
<html>
<head>
  <title>Pro Sports Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f1111;
      color: white;
      display: flex;
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 200px;
      background: #131921;
      padding: 20px;
      height: 100vh;
    }

    .sidebar h2 {
      color: orange;
    }

    .sidebar div {
      margin: 15px 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 5px;
    }

    .sidebar div:hover {
      background: #232f3e;
    }

    /* CENTER */
    .main {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 25px;
      width: 350px;
      margin: auto;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .score {
      font-size: 35px;
      margin: 15px;
      color: cyan;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      background: orange;
      cursor: pointer;
      border-radius: 8px;
    }

    /* RIGHT PANEL */
    .right {
      width: 220px;
      background: #131921;
      padding: 20px;
      height: 100vh;
    }

    .box {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- LEFT -->
<div class="sidebar">
  <h2>Sports</h2>
  <div onclick="setSport('Cricket')">🏏 Cricket</div>
  <div onclick="setSport('Football')">⚽ Football</div>
  <div onclick="setSport('Basketball')">🏀 Basketball</div>
</div>

<!-- CENTER -->
<div class="main">
  <h1 id="title">🏏 Cricket Tracker</h1>

  <div class="card">
    <div class="score" id="score">0 - 0</div>

    <button onclick="addA()">Team A +</button>
    <button onclick="addB()">Team B +</button>
    <button onclick="reset()">Reset</button>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="box">
    <h3>🔥 Status</h3>
    <p id="status">Match Starting...</p>
  </div>

  <div class="box">
    <h3>📊 Info</h3>
    <p>Live Score Tracking</p>
  </div>
</div>

<script>
let a=0,b=0;

function update(){
  document.getElementById("score").innerText = a+" - "+b;

  let status = document.getElementById("status");
  if(a>b) status.innerText="Team A Leading";
  else if(b>a) status.innerText="Team B Leading";
  else status.innerText="Match Equal";
}

function addA(){ a++; update(); }
function addB(){ b++; update(); }
function reset(){ a=0; b=0; update(); }

function setSport(name){
  document.getElementById("title").innerText = "🏆 "+name+" Tracker";
}
</script>

</body>
</html>
